name: Butler
options:
  bundleIdPrefix: com.example
  xcodeVersion: "15.4"
packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    exactVersion: 0.1.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4
targets:
  Butler:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [butler]
    dependencies:
      - package: HotKey
      - package: Sparkle
      - framework: Frameworks/llama.xcframework
        embed: false
      - framework: Frameworks/whisper.xcframework
        embed: false
    info:
      path: butler/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Butler"
        NSMicrophoneUsageDescription: "Butler needs access to your microphone to transcribe your speech."
        NSScreenCaptureUsageDescription: "Butler needs screen capture access to transcribe system and meeting audio."
        LSUIElement: YES
        LSApplicationCategoryType: "public.app-category.productivity"
        SUFeedURL: "https://raw.githubusercontent.com/BGYKanishka/butler/main/appcast.xml"
        SUPublicEDKey: "utb1sqnbrG5XjUltoj8ISOqvoWdb5VKJDx1gJ5U/z+M="
        SUEnableAutomaticChecks: NO
    entitlements:
      path: butler/Resources/butler.entitlements
    settings:
      PRODUCT_NAME: Butler
      MARKETING_VERSION: 1.0.1
      CURRENT_PROJECT_VERSION: 2
      ARCHS: arm64
      EXCLUDED_ARCHS: x86_64
      VALID_ARCHITECTURES: arm64
      ONLY_ACTIVE_ARCH: YES
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_USER_SCRIPT_SANDBOXING: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_OBJC_BRIDGING_HEADER: "butler/Speech/WhisperBridge/BridgingHeader.h"
      FRAMEWORK_SEARCH_PATHS:
        - "$(SRCROOT)/Frameworks"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Frameworks/llama.xcframework/macos-arm64/Headers"
        - "$(SRCROOT)/Frameworks/whisper.xcframework/macos-arm64/Headers"
      OTHER_LDFLAGS:
        - "-framework Accelerate"
        - "-framework Foundation"
        - "-framework Metal"
        - "-framework MetalKit"
        - "-framework CoreAudio"
      OTHER_CFLAGS:
        - "-Wno-documentation"
      OTHER_CPLUSPLUSFLAGS:
        - "-Wno-documentation"

  ButlerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [butlerTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Butler

name: RealtimeAssistant
options:
  bundleIdPrefix: com.example
packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    exactVersion: 0.1.3
targets:
  RealtimeAssistant:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [RealtimeAssistant]
    dependencies:
      - package: HotKey
    info:
      path: RealtimeAssistant/Resources/Info.plist
    entitlements:
      path: RealtimeAssistant/Resources/RealtimeAssistant.entitlements
    settings:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_USER_SCRIPT_SANDBOXING: false
      SWIFT_OBJC_BRIDGING_HEADER: "RealtimeAssistant/Speech/WhisperBridge/BridgingHeader.h"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/Vendor/whisper.cpp/include"
        - "$(SRCROOT)/Vendor/llama.cpp/include"
        - "$(SRCROOT)/Vendor/llama.cpp/ggml/include"
      LIBRARY_SEARCH_PATHS:
        - "$(SRCROOT)/Vendor/whisper.cpp/build/src"
        - "$(SRCROOT)/Vendor/llama.cpp/build/src"
        - "$(SRCROOT)/Vendor/llama.cpp/build/ggml/src"
        - "$(SRCROOT)/Vendor/llama.cpp/build/ggml/src/ggml-metal"
        - "$(SRCROOT)/Vendor/llama.cpp/build/ggml/src/ggml-blas"
      OTHER_LDFLAGS:
        - "-lwhisper"
        - "-lllama"
        - "-lggml"
        - "-lggml-base"
        - "-lggml-cpu"
        - "-lggml-metal"
        - "-lggml-blas"
        - "-framework Accelerate"
        - "-framework Foundation"
        - "-framework Metal"
        - "-framework MetalKit"

  RealtimeAssistantTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [RealtimeAssistantTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RealtimeAssistant
